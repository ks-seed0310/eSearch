<!doctype html>
<html lang=ja>
  <head>
    <meta charse=utf-8>
  </head>
  <body>
    <p id="gi"></p>
    <a id="dl" download></a>
    <script>
      const d=document.getElementById("dl")
      const p=document.getElementById("gi")
      const u=new URLSearchParams(location.search).get("path")??"blank.txt"
      p.innerHTML=u+`をダウンロードします...(ダウンロードが開始されない場合は<a href=${u} download>こちら</a>を押してください。)`
      d.href=u
      d.click()
    </script>
  </body>
</html>
